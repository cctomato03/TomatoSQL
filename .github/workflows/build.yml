name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # 先跑测试，避免把坏包发出去
  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Frontend typecheck + build
        run: npm run build

      - name: Rust tests (SQLite 引擎 / 导入导出 / 同步 / 加密)
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Cloud sync server tests
        run: node --test "test/**/*.test.js"
        working-directory: server

  build:
    name: Build (${{ matrix.label }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            artifact: windows-x64
            args: --bundles nsis,msi
            mac: false
          - label: macOS (Apple Silicon)
            os: macos-latest
            artifact: macos-arm64
            args: --bundles dmg,app
            target: aarch64-apple-darwin
            mac: true
          # macos-13 已被 GitHub 下线；Intel 构建用 macos-15-intel（也可用 macos-26-intel）
          - label: macOS (Intel)
            os: macos-15-intel
            artifact: macos-x64
            args: --bundles dmg,app
            target: x86_64-apple-darwin
            mac: true
          - label: Ubuntu 22.04
            os: ubuntu-22.04
            artifact: linux-x64
            args: --bundles deb,appimage
            mac: false

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.artifact }}
          workspaces: "./src-tauri -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci

      # 判断仓库是否配置了 Apple 签名证书：
      # 有 → 写入签名/公证所需环境变量（供后续 tauri-action 使用），并在日志里给 notice
      # 没有 → 输出 enabled=false，走未签名构建，CI 不会因为缺密钥失败
      - name: Prepare macOS signing env
        id: signing
        if: matrix.mac
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE}" ] || [ -z "${APPLE_CERTIFICATE_PASSWORD}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=macOS 未签名::未配置 APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD，macOS 产物为未签名版本（见 docs/MACOS-SIGNING.md）"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

          # 只写入非空变量，避免出现空的 APPLE_SIGNING_IDENTITY 让 codesign 报错
          {
            printf 'APPLE_CERTIFICATE<<__CERT_EOF__\n%s\n__CERT_EOF__\n' "${APPLE_CERTIFICATE}"
            printf 'APPLE_CERTIFICATE_PASSWORD<<__CERT_PWD_EOF__\n%s\n__CERT_PWD_EOF__\n' "${APPLE_CERTIFICATE_PASSWORD}"
            for name in APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              value="${!name:-}"
              if [ -n "${value}" ]; then
                printf '%s<<__%s_EOF__\n%s\n__%s_EOF__\n' "$name" "$name" "$value" "$name"
              fi
            done
          } >> "$GITHUB_ENV"

          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            echo "::notice title=macOS 签名::已检测到证书与公证账号，将签名并公证"
          else
            echo "::notice title=macOS 签名::已检测到证书，但未配置 APPLE_ID / APPLE_TEAM_ID，只签名、不公证"
          fi

      - name: Build app (macOS 签名 + 公证)
        if: matrix.mac && steps.signing.outputs.enabled == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }} ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: Build app (未签名：Windows / Linux / 未配置证书的 macOS)
        if: ${{ !(matrix.mac && steps.signing.outputs.enabled == 'true') }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }} ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: Verify macOS signature (签字校验)
        if: matrix.mac && steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          APP=$(find src-tauri/target -type d -name "TomatoSQL.app" | head -n 1)
          echo "app=$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|Runtime"
          spctl --assess --type execute --verbose=4 "$APP" || echo "spctl 警告：公证/捆包检查未通过时请查看上面的输出"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: tomato-sql-${{ matrix.artifact }}
          if-no-files-found: warn
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/appimage/*.AppImage

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect installers
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.deb" -o -name "*.AppImage" \) -exec cp {} release/ \;
          ls -lh release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          draft: false
          generate_release_notes: true

  docker:
    name: Build & push sync server image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/sync
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
