name: Release

# 只在「发布 Release」时构建：在 GitHub 上创建并发布 Release（或 `gh release create`）后触发，
# 构建完成的安装包会自动追加到同一个 Release 的 Assets 里。
# workflow_dispatch 仅用于手动重跑：填了 tag 就同样把产物挂到该 Release，留空则只构建不发布。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "要附加产物的 Release tag（如 v1.0.0）；留空则只构建不发布"
        required: false
        default: ""
      run_id:
        description: "可选：复用某次运行的构建产物（填 run id 时跳过构建，只重新附加到 Release）"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always

# 同一 tag 的发布任务串行执行，避免多平台并发上传同一个 Release 时互相覆盖
concurrency:
  group: release-${{ github.event.release.tag_name || github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  # 解析 tag / 版本号，决定是否需要发布
  prepare:
    name: Prepare
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      publish: ${{ steps.meta.outputs.publish }}
      run_id: ${{ steps.meta.outputs.run_id }}
      skip_build: ${{ steps.meta.outputs.skip_build }}
    steps:
      - name: Resolve tag & version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          VERSION="${TAG#v}"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
            if [ -n "$TAG" ]; then
              echo "::warning title=版本号::tag ($TAG) 不是语义化版本（v1.2.3），将沿用仓库里 tauri.conf.json / package.json 中的版本号"
            fi
          fi
          if [ -n "$TAG" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=发布模式::将把产物附加到 Release $TAG"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=仅构建::未提供 tag，产物只作为 workflow artifact 保留"
          fi

          REUSE_RUN="${{ github.event.inputs.run_id }}"
          echo "run_id=$REUSE_RUN" >> "$GITHUB_OUTPUT"
          if [ -n "$REUSE_RUN" ]; then
            echo "skip_build=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=复用产物::跳过构建，直接复用 run $REUSE_RUN 的产物"
          else
            echo "skip_build=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test
    needs: prepare
    if: needs.prepare.outputs.skip_build != 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Frontend typecheck + build
        run: npm run build

      - name: Rust tests (SQLite 引擎 / 导入导出 / 同步 / 加密)
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Cloud sync server tests
        run: node --test "test/**/*.test.js"
        working-directory: server

  build:
    name: Build (${{ matrix.label }})
    needs: [prepare, test]
    if: needs.prepare.outputs.skip_build != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            artifact: windows-x64
            args: --bundles nsis,msi
            mac: false
          - label: macOS (Apple Silicon)
            os: macos-latest
            artifact: macos-arm64
            args: --bundles dmg,app
            target: aarch64-apple-darwin
            mac: true
          # macos-13 已被 GitHub 下线；Intel 构建用 macos-15-intel
          - label: macOS (Intel)
            os: macos-15-intel
            artifact: macos-x64
            args: --bundles dmg,app
            target: x86_64-apple-darwin
            mac: true
          - label: Ubuntu 22.04
            os: ubuntu-22.04
            artifact: linux-x64
            args: --bundles deb,appimage
            mac: false

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.artifact }}
          workspaces: "./src-tauri -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci

      # 让应用版本号与 Release tag 保持一致（安装包文件名里带的就是这个版本）
      - name: Sync version from tag
        if: needs.prepare.outputs.version != ''
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const v = process.env.VERSION;
            for (const f of ["package.json", "src-tauri/tauri.conf.json"]) {
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              j.version = v;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            }
            const cargoPath = "src-tauri/Cargo.toml";
            const cargo = fs.readFileSync(cargoPath, "utf8")
              .replace(/^version = "[^"]+"/m, `version = "${v}"`);
            fs.writeFileSync(cargoPath, cargo);
            console.log("版本号已同步为", v);
          '

      # 判断仓库是否配置了 Apple 签名证书：
      # 有 → 写入签名/公证所需环境变量（供后续 tauri-action 使用），并在日志里给 notice
      # 没有 → 输出 enabled=false，走未签名构建，CI 不会因为缺密钥失败
      - name: Prepare macOS signing env
        id: signing
        if: matrix.mac
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE}" ] || [ -z "${APPLE_CERTIFICATE_PASSWORD}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=macOS 未签名::未配置 APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD，macOS 产物为未签名版本（见 docs/MACOS-SIGNING.md）"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

          # 只写入非空变量，避免出现空的 APPLE_SIGNING_IDENTITY 让 codesign 报错
          {
            printf 'APPLE_CERTIFICATE<<__CERT_EOF__\n%s\n__CERT_EOF__\n' "${APPLE_CERTIFICATE}"
            printf 'APPLE_CERTIFICATE_PASSWORD<<__CERT_PWD_EOF__\n%s\n__CERT_PWD_EOF__\n' "${APPLE_CERTIFICATE_PASSWORD}"
            for name in APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              value="${!name:-}"
              if [ -n "${value}" ]; then
                printf '%s<<__%s_EOF__\n%s\n__%s_EOF__\n' "$name" "$name" "$value" "$name"
              fi
            done
          } >> "$GITHUB_ENV"

          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            echo "::notice title=macOS 签名::已检测到证书与公证账号，将签名并公证"
          else
            echo "::notice title=macOS 签名::已检测到证书，但未配置 APPLE_ID / APPLE_TEAM_ID，只签名、不公证"
          fi

      - name: Build app (macOS 签名 + 公证)
        if: matrix.mac && steps.signing.outputs.enabled == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }} ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: Build app (未签名：Windows / Linux / 未配置证书的 macOS)
        if: ${{ !(matrix.mac && steps.signing.outputs.enabled == 'true') }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }} ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: Verify macOS signature (签名校验)
        if: matrix.mac && steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          APP=$(find src-tauri/target -type d -name "TomatoSQL.app" | head -n 1)
          echo "app=$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|Runtime"
          spctl --assess --type execute --verbose=4 "$APP" || echo "spctl 警告：公证/捆包检查未通过时请查看上面的输出"

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tomato-sql-${{ matrix.artifact }}
          if-no-files-found: warn
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/appimage/*.AppImage

  # 把各平台产物汇总后附加到 Release（供用户下载）
  publish:
    name: Attach assets to release
    needs: [prepare, build]
    # 复用已有产物（skip_build）时 build 会被跳过，因此不能用默认的 success() 判断
    if: |
      always() && needs.prepare.result == 'success'
      && needs.prepare.outputs.publish == 'true'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-22.04
    permissions:
      # contents: write → 往 Release 上传 Assets
      contents: write
      # actions: read → 下载其它 job 里上传的 artefacts（缺这一项会 403，
      # 报 "Artifact download failed after 5 retries"）
      actions: read
    steps:
      - name: Download installers (this run)
        if: needs.prepare.outputs.run_id == ''
        uses: actions/download-artifact@v4
        with:
          # 只取安装包产物，跳过 docker buildx 自动生成的状态产物
          pattern: tomato-sql-*
          path: assets
          merge-multiple: true

      - name: Download installers (from run ${{ needs.prepare.outputs.run_id }})
        if: needs.prepare.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          pattern: tomato-sql-*
          path: assets
          merge-multiple: true
          run-id: ${{ needs.prepare.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show downloaded tree
        run: find assets -type f -printf '%s\t%p\n' | sort -k2

      # upload-artifact 会保留相对路径（如 assets/release/bundle/dmg/x.dmg），
      # 这里按扩展名把安装包汇总到一层，便于后面用 release-assets/* 匹配
      - name: Flatten installers
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find assets -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) \
            -exec cp -v {} release-assets/ \;
          ls -lh release-assets

      - name: Fail fast if no installers
        run: |
          set -euo pipefail
          COUNT=$(find release-assets -type f | wc -l)
          echo "共 $COUNT 个安装包"
          test "$COUNT" -ge 3

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: release-assets/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ github.event.release.prerelease || false }}

      - name: Verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq '.assets[] | "\(.name)\t\(.size) bytes"'
          TOTAL=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq '.assets | length')
          echo "Release $TAG 现有 $TOTAL 个附件"
          test "$TOTAL" -ge 3

  docker:
    name: Build & push sync server image
    needs: [prepare, test]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/sync
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
